<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaida i wanna ask u something</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff7eb3,#ff758c);
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:90%;
    max-width:450px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    color:#ff4f87;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ffd1e1;
    border-radius:10px;
    margin-bottom:20px;
    font-size:16px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    border:none;
    padding:12px 25px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.yes{
    background:#ff4f87;
    color:white;
}

.no{
    background:#e5e5e5;
}

#success{
    display:none;
    margin-top:20px;
    color:#ff4f87;
    font-size:22px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="card">

<h1>Will You Be My Girlfriend?</h1>

<p> choose an answer ❤️</p>

<form id="loveForm"
action="https://api.web3forms.com/submit"
method="POST">

<input
type="hidden"
name="access_key"
value="7448b2c7-5aaf-4376-a4cc-428c69c166b6">

<input
type="hidden"
name="subject"
value="She Said YES ❤️">


<div class="buttons">

<button class="yes" type="submit">
Yes i love you
</button>

<button class="no" type="button" id="noBtn">
No u ugly
</button>

</div>

</form>

<div id="success">
❤️ YAY! ❤️<br>
You made me the happiest person alive.
</div>

</div>

<script>

document.getElementById("loveForm")
.addEventListener("submit", function(){

    setTimeout(() => {
        document.getElementById("success")
        .style.display = "block";
    }, 500);

});

document.getElementById("noBtn")
.addEventListener("click", function(){

    alert("Maybe someday ❤️");

});

</script>

</body>
</html>
