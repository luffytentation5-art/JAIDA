<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Jaida I wanna ask u something</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9ecf,#ffd6e7);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    color:white;
    font-size:3rem;
    text-shadow:2px 2px 10px rgba(0,0,0,.2);
}

.buttons{
    margin-top:30px;
}

button{
    padding:15px 35px;
    font-size:1.2rem;
    border:none;
    border-radius:15px;
    cursor:pointer;
    transition:0.2s;
}

#yes{
    background:white;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#ff4d6d;
    color:white;
    position:absolute;
}

#message{
    display:none;
    color:white;
    font-size:2rem;
    margin-top:25px;
}
</style>

</head>

<body>

<div class="container">
    <h1>We been talking for a long time and I was wondering would u be my girlfriend?</h1>

```
<div class="buttons">
    <button id="yes">YES I LOVE U</button>
    <button id="no">NO u ugly</button>
</div>

<div id="message">
    YAYYY ❤️ You Made Me The Happiest Person Alive ❤️
</div>
```

</div>

<script>
const noBtn = document.getElementById("no");

function moveButton(){
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

document.getElementById("yes").addEventListener("click", () => {
    document.querySelector(".buttons").style.display = "none";
    document.getElementById("message").style.display = "block";
});
</script>

</body>
</html>
