<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaida</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff7eb3,#ff758c);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.card{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:500px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    color:#ff4f87;
    margin-bottom:15px;
}

p{
    color:#666;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 28px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.yes{
    background:#ff4f87;
    color:white;
}

.no{
    background:#e5e5e5;
}

#success{
    display:none;
    margin-top:25px;
    color:#ff4f87;
    font-size:24px;
    font-weight:bold;
}

.heart{
    position:absolute;
    color:white;
    font-size:24px;
    animation:float 6s linear infinite;
    pointer-events:none;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }

    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

</style>

</head>

<body>

<div class="card">

<h1>Will You Be My Girlfriend?</h1>

<p>I have something important to ask you</p>

<form id="loveForm"
action="https://api.web3forms.com/submit"
method="POST">

<input
type="hidden"
name="access_key"
value="TU_ACCESS_KEY">

<input
type="hidden"
name="subject"
value="She Said YES ❤️">

<input
type="hidden"
name="message"
value="She clicked YES ❤️">

<div class="buttons">

<button class="yes" type="submit">
Yes i love u
</button>

<button class="no" type="button" id="noBtn">
No u ugly
</button>

</div>

</form>

<div id="success">
❤️ YES!!! ❤️<br><br>
You just made me the happiest person alive.
</div>

</div>

<script>

// Corazones flotando
for(let i=0;i<40;i++){

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*4+4)+"s";
    heart.style.fontSize=(Math.random()*20+15)+"px";

    document.body.appendChild(heart);
}

// Mensaje al presionar YES
document.getElementById("loveForm")
.addEventListener("submit", function(){

    setTimeout(function(){

        document.getElementById("success")
        .style.display="block";

    },300);

});

// Mensaje al presionar NO
document.getElementById("noBtn")
.addEventListener("click", function(){

    alert("Aww 😢");

});

</script>

</body>
</html>
